<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aimex — Gestão Inteligente de Fazendas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12190F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12190F;
    --surface:#1B2419;
    --surface-2:#223026;
    --soil:#C98A3E;
    --pasture:#7CA86B;
    --text:#EDEAE0;
    --text-dim:#9CA894;
    --danger:#C1503B;
    --border:rgba(237,234,224,0.10);
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  .display{ font-family:'Fraunces', serif; }

  /* ---------- Tela de login ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(124,168,107,0.08), transparent 55%),
      var(--bg);
  }
  #login-screen::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-radial-gradient(circle at 50% 120%, transparent 0, transparent 38px, rgba(237,234,224,0.028) 39px, transparent 40px);
    pointer-events:none;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:36px;
    justify-content:center;
  }
  .brand-mark{
    width:34px; height:34px;
    border:2px solid var(--soil);
    border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:16px;
    color:var(--soil);
  }
  .brand-name{ font-family:'Fraunces', serif; font-size:20px; font-weight:600; letter-spacing:0.01em;}
  .brand-sub{ color:var(--text-dim); font-size:12px; letter-spacing:0.08em; text-transform:uppercase; }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:32px;
    width:100%;
    max-width:380px;
    position:relative;
    z-index:1;
  }
  .card h1{
    font-family:'Fraunces', serif;
    font-size:24px;
    font-weight:600;
    margin-bottom:6px;
  }
  .card .subtitle{
    color:var(--text-dim);
    font-size:13.5px;
    margin-bottom:24px;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
    letter-spacing:0.02em;
  }
  input, select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px 14px;
    color:var(--text);
    font-size:14.5px;
    font-family:'Inter', sans-serif;
    margin-bottom:16px;
    outline:none;
    transition:border-color .15s ease;
  }
  input:focus, select:focus{ border-color:var(--soil); }
  input::placeholder{ color:var(--text-dim); }

  button{
    width:100%;
    background:var(--soil);
    color:#1A1305;
    border:none;
    border-radius:9px;
    padding:13px;
    font-size:14.5px;
    font-weight:600;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
  }
  button:hover{ filter:brightness(1.08); }
  button:active{ transform:scale(0.98); }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  button.secondary{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
  }
  button.danger{ background:var(--danger); color:#fff; }

  .error-msg{
    background:rgba(193,80,59,0.12);
    border:1px solid rgba(193,80,59,0.35);
    color:#E8A99A;
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:16px;
    display:none;
  }
  .hint{ font-size:12px; color:var(--text-dim); text-align:center; margin-top:16px; }

  /* ---------- Shell do app (pós-login) ---------- */
  #app-shell{ display:none; min-height:100vh; }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  .topbar .who{ font-size:13px; color:var(--text-dim); }
  .topbar .who strong{ color:var(--text); }
  .logout-btn{
    width:auto;
    background:transparent;
    border:1px solid var(--border);
    padding:8px 14px;
    font-size:13px;
    font-weight:500;
  }

  main{ padding:28px 24px; max-width:920px; margin:0 auto; }
  .section-title{
    font-family:'Fraunces', serif;
    font-size:21px;
    font-weight:600;
    margin-bottom:4px;
  }
  .section-sub{ color:var(--text-dim); font-size:13.5px; margin-bottom:24px; }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
    margin-bottom:20px;
  }
  .panel h2{
    font-size:15px;
    font-weight:600;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .row{ display:flex; gap:12px; }
  .row > *{ flex:1; }

  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--text-dim);
    padding:8px 10px;
    border-bottom:1px solid var(--border);
  }
  td{
    padding:12px 10px;
    font-size:13.5px;
    border-bottom:1px solid var(--border);
  }
  .badge{
    display:inline-block;
    padding:3px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
    font-family:'IBM Plex Mono', monospace;
  }
  .badge.ativo{ background:rgba(124,168,107,0.15); color:var(--pasture); }
  .badge.inativo{ background:rgba(193,80,59,0.15); color:#E8A99A; }
  .badge.aberto{ background:rgba(201,138,62,0.18); color:var(--soil); }
  .badge.aceito{ background:rgba(90,140,200,0.18); color:#8FB8E8; }
  .badge.resolvido{ background:rgba(124,168,107,0.15); color:var(--pasture); }
  .badge.pendente{ background:rgba(201,138,62,0.18); color:var(--soil); }
  .badge.aprovado{ background:rgba(90,140,200,0.18); color:#8FB8E8; }
  .badge.negado{ background:rgba(193,80,59,0.15); color:#E8A99A; }
  .badge.retirado{ background:rgba(124,168,107,0.15); color:var(--pasture); }
  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--text-dim);
    font-size:13.5px;
  }
  .setor-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--soil);
    text-transform:uppercase;
  }
  .placeholder-panel{
    text-align:center;
    padding:60px 20px;
  }
  .placeholder-panel .icon{ font-size:32px; margin-bottom:14px; }
  .placeholder-panel h2{ justify-content:center; margin-bottom:8px; }
  .placeholder-panel p{ color:var(--text-dim); max-width:360px; margin:0 auto; }

  /* ---------- Cards / stats / mini gráficos ---------- */
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:12px;
    margin-bottom:4px;
  }
  .stat-card{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
  }
  .stat-card .num{ font-family:'IBM Plex Mono', monospace; font-size:26px; font-weight:600; }
  .stat-card .label{ font-size:11.5px; color:var(--text-dim); margin-top:4px; }
  .stat-card.alert .num{ color:var(--danger); }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar-row .bar-label{ width:110px; font-size:12.5px; color:var(--text-dim); flex-shrink:0; }
  .bar-track{ flex:1; height:8px; background:var(--surface-2); border-radius:6px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--soil); border-radius:6px; transition:width .4s ease; }
  .bar-row .bar-num{ width:26px; text-align:right; font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--text-dim); }

  .os-card{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    margin-bottom:10px;
  }
  .os-card .os-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .os-card .os-tipo{ font-weight:600; font-size:14px; }
  .os-card .os-desc{ font-size:13px; color:var(--text-dim); margin-bottom:10px; }
  .os-card .os-meta{ font-size:11.5px; color:var(--text-dim); font-family:'IBM Plex Mono', monospace; margin-bottom:10px; }
  .os-card .os-actions{ display:flex; gap:8px; }
  .os-card .os-actions button{ width:auto; padding:8px 14px; font-size:13px; }
  .item-row{ display:flex; gap:8px; align-items:flex-end; margin-bottom:10px; }
  .item-row select, .item-row input{ margin-bottom:0; }
  .item-row button{ width:auto; padding:11px 16px; flex-shrink:0; }
  .itens-usados-list{ font-size:12.5px; color:var(--text-dim); margin-bottom:10px; }
  .itens-usados-list li{ list-style:none; padding:4px 0; border-bottom:1px dashed var(--border); }
  small.field-hint{ display:block; font-size:11.5px; color:var(--text-dim); margin:-10px 0 14px; }

  /* ---------- Gráficos de pizza ---------- */
  .pie-wrap{ display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
  .pie-circle{ width:150px; height:150px; border-radius:50%; flex-shrink:0; }
  .pie-legend{ display:flex; flex-direction:column; gap:9px; flex:1; min-width:180px; }
  .pie-legend-row{ display:flex; align-items:center; gap:8px; }
  .pie-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .pie-label{ flex:1; font-size:12.5px; color:var(--text-dim); }
  .pie-value{ font-size:12.5px; font-family:'IBM Plex Mono', monospace; }

  /* ---------- Orçamento por centro de custo ---------- */
  .orcamento-row{ padding:14px 0; border-bottom:1px solid var(--border); }
  .orcamento-row:last-child{ border-bottom:none; }
  .orcamento-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:13.5px; }
  .orcamento-top .gasto-atual{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--text-dim); }
  .orcamento-top .gasto-atual.estourou{ color:var(--danger); font-weight:600; }
  .orcamento-edit{ display:flex; gap:8px; margin-top:8px; }
  .orcamento-edit input{ margin-bottom:0; }
  .orcamento-edit button{ width:auto; padding:10px 16px; flex-shrink:0; }

  /* ---------- Chamados: foto e localização ---------- */
  .os-card .os-foto{
    width:100%; max-width:220px; border-radius:8px; margin:8px 0;
    display:block; border:1px solid var(--border);
  }
  .file-input-wrap{ margin-bottom:16px; }
  .file-input-wrap input[type=file]{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    border-radius:9px; padding:10px 12px; color:var(--text-dim); font-size:13px;
  }
  .loc-btn{
    background:transparent; border:1px solid var(--border); color:var(--text-dim);
    padding:10px; font-size:12.5px; margin-bottom:16px;
  }
  .loc-btn.ok{ color:var(--pasture); border-color:rgba(124,168,107,0.35); }
  .loc-link{ color:var(--soil); text-decoration:none; }
  .alto-valor-tag{
    display:inline-block; background:rgba(193,80,59,0.15); color:#E8A99A;
    font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;
    padding:2px 8px; border-radius:20px; margin-left:8px;
  }

  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--border);
    padding:12px 20px; border-radius:9px; font-size:13.5px;
    display:none; z-index:100;
  }
  #toast.show{ display:block; }
  #toast.error{ border-color:rgba(193,80,59,0.4); color:#E8A99A; }

  /* ---------- Splash screen ---------- */
  #splash-screen{
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 700px 500px at 8% 5%, rgba(35,90,210,0.30), transparent 60%),
      radial-gradient(ellipse 700px 500px at 95% 95%, rgba(35,90,210,0.26), transparent 60%),
      #060912;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    animation: splash-fade 3s ease forwards;
  }
  #splash-screen img{
    width:min(72vw, 420px);
    height:auto;
    object-fit:contain;
    animation: splash-pop .7s cubic-bezier(.2,.8,.2,1) backwards;
  }
  @keyframes splash-pop{
    from{ opacity:0; transform:scale(0.92); }
    to{ opacity:1; transform:scale(1); }
  }
  @keyframes splash-fade{
    0%{ opacity:1; pointer-events:all; }
    85%{ opacity:1; pointer-events:all; }
    100%{ opacity:0; pointer-events:none; }
  }
  @media (prefers-reduced-motion: reduce){
    #splash-screen, #splash-screen img{ animation-duration:.01s; }
  }
</style>
</head>
<body>

<!-- ===== SPLASH (3s) ===== -->
<div id="splash-screen">
  <img src="logo-aimex.png" alt="Aimex Software" onerror="this.style.display='none'; document.getElementById('splash-fallback').style.display='flex';">
  <div id="splash-fallback" class="brand-mark" style="display:none; width:96px; height:96px; font-size:34px;">AX</div>
</div>

<!-- ===== LOGIN ===== -->
<div id="login-screen">
  <div style="width:100%; max-width:380px;">
    <div class="brand">
      <div class="brand-mark">AX</div>
      <div>
        <div class="brand-name">Aimex</div>
        <div class="brand-sub">Gestão Inteligente de Fazendas</div>
      </div>
    </div>
    <div class="card">
      <h1>Entrar</h1>
      <div class="subtitle">Acesse com seu e-mail cadastrado</div>
      <div class="error-msg" id="login-error"></div>
      <label>E-mail</label>
      <input type="email" id="login-email" placeholder="seuemail@exemplo.com" autocomplete="username">
      <label>Senha</label>
      <input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password">
      <button id="btn-login">Entrar</button>
      <div class="hint">Acesso apenas por convite. Líderes e funcionários são cadastrados pelo proprietário ou pelo líder do setor.</div>
    </div>
  </div>
</div>

<!-- ===== APP (pós-login) ===== -->
<div id="app-shell">
  <div class="topbar">
    <div class="brand" style="margin-bottom:0;">
      <div class="brand-mark" style="width:28px;height:28px;font-size:13px;">AX</div>
      <div class="brand-name" style="font-size:16px;">Aimex</div>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <div class="who">Logado como <strong id="who-name">—</strong></div>
      <button class="logout-btn" id="btn-logout">Sair</button>
    </div>
  </div>
  <main id="main-content"></main>
</div>

<div id="toast"></div>

<!-- Firebase SDK (compat, sem build step) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const OWNER_EMAIL = 'menezesapptec@gmail.com';
const SETORES = {
  veterinario: 'Veterinário',
  estrutural: 'Equipe de Campo',
  maquinario: 'Máquinas',
  nutricional: 'Nutricional / Trato',
  financeiro: 'Financeiro',
  admin: 'Administrativo',
  estoque: 'Estoque / Almoxarifado'
};
const SETORES_CENTRO_CUSTO = Object.fromEntries(Object.entries(SETORES).filter(([k]) => k !== 'estoque'));
const SETORES_DESTINO_CHAMADO = ['estrutural', 'veterinario', 'nutricional'];
const CATEGORIAS_ESTOQUE = {
  almoxarifado: 'Almoxarifado',
  combustivel: 'Combustível',
  racao_insumo: 'Ração / Insumo',
  peca_maquinario: 'Peça / Maquinário'
};
const UNIDADES = ['kg','litro','unidade','saca'];
const STATUS_OS_LABEL = { aberto: 'Aberto', aceito: 'Em atendimento', resolvido: 'Resolvido' };
const STATUS_SOLIC_LABEL = { pendente: 'Pendente', aprovado: 'Aprovado — retirar', negado: 'Negado', retirado: 'Retirado' };
const PIE_PALETTE = ['#C98A3E','#7CA86B','#8FB8E8','#C1503B','#B98BD1','#E0C36B','#5FA8A0','#D98CB3'];
const VALOR_ALTO_MINIMO = 1000;

let currentUser = null;
let currentUserDoc = null;

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  setTimeout(() => { t.className = ''; }, 3200);
}

// ---------- LOGIN ----------
document.getElementById('btn-login').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if(!email || !senha){
    errEl.textContent = 'Preencha e-mail e senha.';
    errEl.style.display = 'block';
    return;
  }
  try{
    await auth.signInWithEmailAndPassword(email, senha);
  }catch(e){
    errEl.textContent = 'E-mail ou senha inválidos.';
    errEl.style.display = 'block';
  }
});

document.getElementById('btn-logout').addEventListener('click', () => auth.signOut());

// ---------- ROTEAMENTO POR AUTH STATE ----------
auth.onAuthStateChanged(async (user) => {
  if(!user){
    currentUser = null; currentUserDoc = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-shell').style.display = 'none';
    return;
  }
  currentUser = user;
  const ref = db.collection('usuarios').doc(user.uid);
  let snap = await ref.get();

  if(!snap.exists){
    if(user.email === OWNER_EMAIL){
      await ref.set({
        nome: 'Proprietário',
        email: user.email,
        telefone: '',
        role: 'proprietario',
        setor: null,
        lider_id: null,
        status: 'ativo',
        criado_em: firebase.firestore.FieldValue.serverTimestamp(),
        criado_por: user.uid
      });
      snap = await ref.get();
    } else {
      showToast('Sua conta ainda não foi cadastrada no sistema. Fale com o proprietário.', true);
      await auth.signOut();
      return;
    }
  }

  currentUserDoc = snap.data();
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').style.display = 'block';
  document.getElementById('who-name').textContent = currentUserDoc.nome + roleLabel(currentUserDoc);
  route();
});

function roleLabel(u){
  if(u.role === 'proprietario') return ' · Proprietário';
  if(u.role === 'lider') return ' · Líder ' + (SETORES[u.setor] || '');
  if(u.role === 'funcionario') return ' · ' + (SETORES[u.setor] || '');
  return '';
}

function route(){
  if(currentUserDoc.role === 'proprietario') renderProprietario();
  else if(currentUserDoc.role === 'lider') renderLider();
  else renderFuncionario();
}

// ---------- PAINEL PROPRIETÁRIO ----------
async function renderProprietario(){
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="section-title">Painel do Proprietário</div>
    <div class="section-sub">Visão geral das operações e cadastro de líderes de setor.</div>

    <div class="panel">
      <h2>Ordens de serviço</h2>
      <div class="stats-grid" id="stats-cards">
        <div class="stat-card"><div class="num">—</div><div class="label">Abertas</div></div>
        <div class="stat-card"><div class="num">—</div><div class="label">Em atendimento</div></div>
        <div class="stat-card"><div class="num">—</div><div class="label">Resolvidas</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>Financeiro — estoque</h2>
      <div class="stats-grid" id="stats-financeiro">
        <div class="stat-card"><div class="num">—</div><div class="label">Valor total em estoque</div></div>
        <div class="stat-card"><div class="num">—</div><div class="label">Saída hoje</div></div>
        <div class="stat-card"><div class="num">—</div><div class="label">Saída no mês</div></div>
      </div>
    </div>

    <div class="panel">
      <h2>Ordens abertas por setor</h2>
      <div id="pie-os-setor"><div class="empty-state">Carregando...</div></div>
    </div>

    <div class="panel">
      <h2>Para onde está indo o dinheiro (mês atual)</h2>
      <div id="pie-gasto-centro"><div class="empty-state">Carregando...</div></div>
    </div>

    <div class="panel">

    <div class="panel">
      <h2>Estoque baixo</h2>
      <div id="estoque-baixo"><div class="empty-state">Carregando...</div></div>
    </div>

    <div class="panel">
      <h2>Cadastrar líder de setor</h2>
      <div class="error-msg" id="cad-lider-error"></div>
      <div class="row">
        <div><label>Nome</label><input id="lider-nome" placeholder="Nome completo"></div>
        <div><label>Setor</label>
          <select id="lider-setor">
            ${Object.entries(SETORES).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="row">
        <div><label>E-mail</label><input id="lider-email" type="email" placeholder="email@exemplo.com"></div>
        <div><label>Senha provisória</label><input id="lider-senha" type="text" placeholder="mínimo 6 caracteres"></div>
      </div>
      <button id="btn-cad-lider">Cadastrar líder</button>
      <small class="field-hint" style="margin-top:10px;">Escolha o setor "Estoque / Almoxarifado" pra criar o Estoquista — só esse perfil cadastra produtos.</small>
    </div>

    <div class="panel">
      <h2>Líderes e equipes</h2>
      <div id="lista-usuarios"><div class="empty-state">Carregando...</div></div>
    </div>
  `;

  document.getElementById('btn-cad-lider').addEventListener('click', () => cadastrarUsuario({
    nome: document.getElementById('lider-nome').value.trim(),
    email: document.getElementById('lider-email').value.trim(),
    senha: document.getElementById('lider-senha').value,
    role: 'lider',
    setor: document.getElementById('lider-setor').value,
    errorElId: 'cad-lider-error',
    onSuccess: () => {
      document.getElementById('lider-nome').value = '';
      document.getElementById('lider-email').value = '';
      document.getElementById('lider-senha').value = '';
    }
  }));

  db.collection('usuarios').where('role', 'in', ['lider','funcionario'])
    .onSnapshot((qs) => {
      renderListaHierarquia(qs, 'lista-usuarios', true);
    });

  db.collection('ordens_servico').onSnapshot((qs) => {
    let abertas = 0, aceitas = 0, resolvidas = 0;
    const porSetor = {};
    qs.forEach(doc => {
      const os = doc.data();
      if(os.status === 'aberto') abertas++;
      if(os.status === 'aceito') aceitas++;
      if(os.status === 'resolvido') resolvidas++;
      if(os.status !== 'resolvido'){
        porSetor[os.setor] = (porSetor[os.setor] || 0) + 1;
      }
    });
    const cards = document.querySelectorAll('#stats-cards .stat-card .num');
    if(cards[0]) cards[0].textContent = abertas;
    if(cards[1]) cards[1].textContent = aceitas;
    if(cards[2]) cards[2].textContent = resolvidas;

    renderPieChart('pie-os-setor', Object.entries(porSetor).map(([setor, qtd], i) => ({
      label: SETORES[setor] || setor, value: qtd, color: PIE_PALETTE[i % PIE_PALETTE.length]
    })));
  });

  const inicioMes = new Date(); inicioMes.setDate(1); inicioMes.setHours(0,0,0,0);
  const inicioHoje = new Date(); inicioHoje.setHours(0,0,0,0);
  const inicioMesTS = firebase.firestore.Timestamp.fromDate(inicioMes);
  const inicioHojeTS = firebase.firestore.Timestamp.fromDate(inicioHoje);

  db.collection('movimentacoes_estoque').where('tipo','==','saida').onSnapshot((qs) => {
    let hoje = 0, mes = 0;
    const porCentro = {};
    const porCategoria = {};
    const porMaquina = {};
    const pecasPorMaquina = {};
    qs.forEach(doc => {
      const m = doc.data();
      if(!m.timestamp) return;
      const valor = m.valor_total || 0;
      if(m.maquina_id){
        porMaquina[m.maquina_id] = (porMaquina[m.maquina_id] || 0) + valor;
        pecasPorMaquina[m.maquina_id] = (pecasPorMaquina[m.maquina_id] || { nome: m.maquina_nome, qtd: 0 });
        pecasPorMaquina[m.maquina_id].qtd += 1;
      }
      if(m.timestamp.toMillis() >= inicioMesTS.toMillis()){
        mes += valor;
        if(m.centro_custo) porCentro[m.centro_custo] = (porCentro[m.centro_custo] || 0) + valor;
        const item = estoqueCache.find(i => i.id === m.item_id);
        const cat = item ? (CATEGORIAS_ESTOQUE[item.categoria] || item.categoria) : 'Outros';
        porCategoria[cat] = (porCategoria[cat] || 0) + valor;
      }
      if(m.timestamp.toMillis() >= inicioHojeTS.toMillis()) hoje += valor;
    });
    const cardsF = document.querySelectorAll('#stats-financeiro .stat-card .num');
    if(cardsF[1]) cardsF[1].textContent = 'R$ ' + hoje.toLocaleString('pt-BR', {minimumFractionDigits:2});
    if(cardsF[2]) cardsF[2].textContent = 'R$ ' + mes.toLocaleString('pt-BR', {minimumFractionDigits:2});

    renderPieChart('pie-gasto-centro', Object.entries(porCentro).map(([setor, valor], i) => ({
      label: SETORES[setor] || setor, value: valor, color: PIE_PALETTE[i % PIE_PALETTE.length]
    })), (v) => 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2}));

    renderPieChart('pie-gasto-categoria', Object.entries(porCategoria).map(([cat, valor], i) => ({
      label: cat, value: valor, color: PIE_PALETTE[i % PIE_PALETTE.length]
    })), (v) => 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2}));

    renderPieChart('pie-gasto-maquina', Object.entries(porMaquina).map(([mid, valor], i) => ({
      label: (pecasPorMaquina[mid] && pecasPorMaquina[mid].nome) || 'Máquina', value: valor, color: PIE_PALETTE[i % PIE_PALETTE.length]
    })), (v) => 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits:2}));

    const tabelaEl = document.getElementById('tabela-gasto-maquina');
    const entradas = Object.entries(porMaquina);
    if(entradas.length === 0){
      tabelaEl.innerHTML = '<div class="empty-state">Nenhuma peça lançada em máquina ainda.</div>';
    } else {
      tabelaEl.innerHTML = `<table><thead><tr><th>Máquina</th><th>Peças trocadas</th><th>Gasto total</th></tr></thead><tbody>
        ${entradas.sort((a,b) => b[1]-a[1]).map(([mid, valor]) => `<tr>
          <td>${(pecasPorMaquina[mid] && pecasPorMaquina[mid].nome) || 'Máquina'}</td>
          <td class="mono">${pecasPorMaquina[mid] ? pecasPorMaquina[mid].qtd : 0}</td>
          <td class="mono">R$ ${valor.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
        </tr>`).join('')}
      </tbody></table>`;
    }

    gastoCentroCache = porCentro;
    renderOrcamentos(porCentro);
  });

  db.collection('orcamentos_centro_custo').onSnapshot((qs) => {
    orcamentosCache = {};
    qs.forEach(doc => { orcamentosCache[doc.id] = doc.data().valor_maximo_mensal || 0; });
    renderOrcamentos(gastoCentroCache);
  });

  db.collection('estoque').orderBy('nome').onSnapshot((qs) => {
    estoqueCache = [];
    qs.forEach(doc => estoqueCache.push({ id: doc.id, ...doc.data() }));

    let valorTotal = 0;
    const baixos = [];
    estoqueCache.forEach(e => {
      valorTotal += (e.quantidade_atual || 0) * (e.custo_unitario_medio || 0);
      if(typeof e.estoque_minimo === 'number' && e.quantidade_atual <= e.estoque_minimo) baixos.push(e);
    });
    const cardsF = document.querySelectorAll('#stats-financeiro .stat-card .num');
    if(cardsF[0]) cardsF[0].textContent = 'R$ ' + valorTotal.toLocaleString('pt-BR', {minimumFractionDigits:2});

    const el = document.getElementById('estoque-baixo');
    if(baixos.length === 0){
      el.innerHTML = '<div class="empty-state">Nenhum item abaixo do mínimo.</div>';
    } else {
      el.innerHTML = `<table><thead><tr><th>Item</th><th>Categoria</th><th>Atual</th><th>Mínimo</th></tr></thead><tbody>
        ${baixos.map(e => `<tr>
          <td>${e.nome}</td>
          <td class="setor-tag">${CATEGORIAS_ESTOQUE[e.categoria] || e.categoria}</td>
          <td class="mono" style="color:var(--danger)">${e.quantidade_atual} ${e.unidade}</td>
          <td class="mono" style="color:var(--text-dim)">${e.estoque_minimo} ${e.unidade}</td>
        </tr>`).join('')}
      </tbody></table>`;
    }
  });
}

function toggleMaquinaField(){
  const sel = document.getElementById('solic-item');
  const wrap = document.getElementById('solic-maquina-wrap');
  if(!sel || !wrap) return;
  const item = estoqueCache.find(i => i.id === sel.value);
  wrap.style.display = (item && item.categoria === 'peca_maquinario') ? 'block' : 'none';
}

function attachSolicitarProdutoHandlers(){
  db.collection('estoque').orderBy('nome').onSnapshot((qs) => {
    estoqueCache = [];
    qs.forEach(doc => estoqueCache.push({ id: doc.id, ...doc.data() }));
    const sel = document.getElementById('solic-item');
    if(sel){
      sel.innerHTML = estoqueCache.map(i => `<option value="${i.id}">${i.nome} (${i.quantidade_atual} ${i.unidade} disp.)</option>`).join('') || '<option value="">Nenhum item cadastrado</option>';
      toggleMaquinaField();
    }
  });

  db.collection('maquinas').orderBy('nome').onSnapshot((qs) => {
    maquinasCache = [];
    qs.forEach(doc => maquinasCache.push({ id: doc.id, ...doc.data() }));
    const selM = document.getElementById('solic-maquina');
    if(selM){
      selM.innerHTML = '<option value="">Selecione a máquina</option>' +
        maquinasCache.map(m => `<option value="${m.id}">${m.nome}${m.identificador ? ' — ' + m.identificador : ''}</option>`).join('');
    }
  });

  const selItem = document.getElementById('solic-item');
  if(selItem) selItem.addEventListener('change', toggleMaquinaField);

  document.getElementById('btn-cad-solic').addEventListener('click', () => {
    const itemId = document.getElementById('solic-item').value;
    const item = estoqueCache.find(i => i.id === itemId);
    const maquinaSel = document.getElementById('solic-maquina');
    const errEl = document.getElementById('cad-solic-error');
    let maquinaId = null, maquinaNome = null;
    if(item && item.categoria === 'peca_maquinario'){
      if(!maquinaSel || !maquinaSel.value){
        errEl.textContent = 'Selecione a máquina onde a peça vai ser aplicada.';
        errEl.style.display = 'block';
        return;
      }
      maquinaId = maquinaSel.value;
      const m = maquinasCache.find(mm => mm.id === maquinaId);
      maquinaNome = m ? m.nome : null;
    }
    criarSolicitacao({
      itemId,
      quantidade: document.getElementById('solic-qtd').value,
      motivo: document.getElementById('solic-motivo').value.trim(),
      maquinaId, maquinaNome,
      errorElId: 'cad-solic-error',
      onSuccess: () => {
        document.getElementById('solic-qtd').value = '';
        document.getElementById('solic-motivo').value = '';
        if(maquinaSel) maquinaSel.value = '';
      }
    });
  });
}

async function criarOS({tipo, descricao, local, setorDestino, fotoFile, geo, errorElId, onSuccess}){
  const errEl = document.getElementById(errorElId);
  errEl.style.display = 'none';
  if(!tipo || !descricao){
    errEl.textContent = 'Preencha tipo e descrição.';
    errEl.style.display = 'block';
    return;
  }
  try{
    let fotoUrl = null;
    if(fotoFile){
      const caminho = `chamados/${setorDestino || currentUserDoc.setor}/${Date.now()}_${fotoFile.name}`;
      const ref = storage.ref().child(caminho);
      await ref.put(fotoFile);
      fotoUrl = await ref.getDownloadURL();
    }
    await db.collection('ordens_servico').add({
      setor: setorDestino || currentUserDoc.setor,
      tipo, descricao,
      localizacao_texto: local || '',
      geo: geo || null,
      foto_url: fotoUrl,
      origem: 'manual',
      status: 'aberto',
      aberto_por: currentUser.uid,
      aberto_por_nome: currentUserDoc.nome,
      aberto_em: firebase.firestore.FieldValue.serverTimestamp(),
      aceito_por: null, aceito_por_nome: null, aceito_em: null,
      itens_usados: [], custo_total: 0,
      resolvido_em: null
    });
    showToast('Chamado enviado.');
    if(onSuccess) onSuccess();
  }catch(e){
    errEl.textContent = 'Erro ao abrir ordem de serviço.';
    errEl.style.display = 'block';
  }
}

window.lancarItemUsado = async function(osId){
  const sel = document.getElementById('sel-item-' + osId);
  const qtdInput = document.getElementById('qtd-item-' + osId);
  const itemId = sel.value;
  const qtd = parseFloat(qtdInput.value);
  if(!itemId || !qtd || qtd <= 0){
    showToast('Selecione um item e uma quantidade válida.', true);
    return;
  }
  const item = estoqueCache.find(i => i.id === itemId);
  if(!item){ showToast('Item não encontrado.', true); return; }
  const valorTotal = qtd * (item.custo_unitario_medio || 0);
  try{
    const osRef = db.collection('ordens_servico').doc(osId);
    const itemRef = db.collection('estoque').doc(itemId);
    const movRef = db.collection('movimentacoes_estoque').doc();
    await db.runTransaction(async (t) => {
      const itemSnap = await t.get(itemRef);
      const osSnap = await t.get(osRef);
      const atual = itemSnap.data().quantidade_atual;
      if(qtd > atual) throw new Error('Quantidade maior que o disponível em estoque.');
      t.update(itemRef, { quantidade_atual: atual - qtd, atualizado_em: firebase.firestore.FieldValue.serverTimestamp() });
      const osData = osSnap.data();
      const novosItens = (osData.itens_usados || []).concat([{ item_id: itemId, nome: item.nome, quantidade: qtd, valor_total: valorTotal }]);
      t.update(osRef, { itens_usados: novosItens, custo_total: (osData.custo_total || 0) + valorTotal });
      t.set(movRef, {
        item_id: itemId, item_nome: item.nome, tipo: 'saida', quantidade: qtd,
        valor_unitario: item.custo_unitario_medio || 0, valor_total: valorTotal,
        origem: 'ordem_servico', os_id: osId,
        responsavel_id: currentUser.uid, responsavel_nome: currentUserDoc.nome,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    showToast('Item lançado.');
    qtdInput.value = '';
  }catch(e){
    showToast(e.message || 'Erro ao lançar item.', true);
  }
};

window.concluirOS = async function(osId){
  try{

// ---------- GRÁFICOS DE PIZZA ----------
function renderPieChart(containerId, entries, valueFormatter){
  const el = document.getElementById(containerId);
  if(!el) return;
  const total = entries.reduce((s, e) => s + (e.value || 0), 0);
  if(total <= 0){
    el.innerHTML = '<div class="empty-state">Sem dados ainda.</div>';
    return;
  }
  let acc = 0;
  const stops = entries.map(e => {
    const start = (acc / total) * 360;
    acc += e.value;
    const end = (acc / total) * 360;
    return `${e.color} ${start}deg ${end}deg`;
  }).join(', ');
  const legend = entries.map(e => `
    <div class="pie-legend-row">
      <span class="pie-dot" style="background:${e.color}"></span>
      <span class="pie-label">${e.label}</span>
      <span class="pie-value">${valueFormatter ? valueFormatter(e.value) : e.value}</span>
    </div>`).join('');
  el.innerHTML = `
    <div class="pie-wrap">
      <div class="pie-circle" style="background:conic-gradient(${stops})"></div>
      <div class="pie-legend">${legend}</div>
    </div>`;
}

      const snap = await t.get(itemRef);

        valor_unitario: item.custo_unitario_medio || 0, valor_total: qtd * (item.custo_unitario_medio || 0),
        origem: 'reposicao', os_id: null, centro_custo: null,
        responsavel_id: currentUser.uid, responsavel_nome: currentUserDoc.nome,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    showToast('Entrada registrada.');
    input.value = '';
  }catch(e){
    showToast('Erro ao registrar entrada.', true);
  }
};

// ---------- SOLICITAÇÕES DE PRODUTO ----------
async function criarSolicitacao({itemId, quantidade, motivo, maquinaId, maquinaNome, errorElId, onSuccess}){
  const errEl = document.getElementById(errorElId);
  errEl.style.display = 'none';
  const qtd = parseFloat(quantidade);
  if(!itemId || !qtd || qtd <= 0){
    errEl.textContent = 'Selecione um item e uma quantidade válida.';
    errEl.style.display = 'block';
    return;
  }
  const item = estoqueCache.find(i => i.id === itemId);
  if(!item){
    errEl.textContent = 'Item não encontrado.';
    errEl.style.display = 'block';
    return;
  }
  const valorEstimado = qtd * (item.custo_unitario_medio || 0);
  const requerDupla = valorEstimado >= VALOR_ALTO_MINIMO;
  try{
    await db.collection('solicitacoes_estoque').add({
      item_id: itemId,
      item_nome: item.nome,
      unidade: item.unidade,
      quantidade_solicitada: qtd,
      custo_unitario: item.custo_unitario_medio || 0,
      valor_estimado: valorEstimado,
      maquina_id: maquinaId || null,
      maquina_nome: maquinaNome || null,
      solicitante_id: currentUser.uid,
      solicitante_nome: currentUserDoc.nome,
      centro_custo: currentUserDoc.setor,
      motivo: motivo || '',
      status: 'pendente',
      requer_dupla_aprovacao: requerDupla,
      criado_em: firebase.firestore.FieldValue.serverTimestamp(),
      aprovado_por: null, aprovado_por_nome: null, aprovado_em: null,
      aprovado_lider_por: null, aprovado_lider_nome: null, aprovado_lider_em: null,
      retirado_por: null, retirado_por_nome: null, retirado_em: null
    });
    showToast(requerDupla ? 'Solicitação enviada — precisa de dupla aprovação por ser de alto valor.' : 'Solicitação enviada ao estoque.');
    if(onSuccess) onSuccess();
  }catch(e){
    errEl.textContent = 'Erro ao enviar solicitação.';
    errEl.style.display = 'block';
  }
}

function statusSolicLabel(s){
  if(s.status === 'pendente' && s.requer_dupla_aprovacao){
    if(s.aprovado_por && !s.aprovado_lider_por) return 'Aguardando líder';
    if(!s.aprovado_por && s.aprovado_lider_por) return 'Aguardando estoque';
    return 'Aguardando aprovação (2)';
  }
  return STATUS_SOLIC_LABEL[s.status] || s.status;
}

function renderListaSolicitacoes(qs, containerId, opts){
  opts = opts || {};
  const el = document.getElementById(containerId);
  if(!el) return;
  if(qs.empty){
    el.innerHTML = '<div class="empty-state">Nada por aqui.</div>';
    return;
  }
  let html = '';
  qs.forEach(doc => {
    const s = doc.data();
    const id = doc.id;
    const aplicacao = s.maquina_nome ? ` · aplicação: ${s.maquina_nome}` : '';
    const aprovacoes = [
      s.aprovado_por_nome ? 'estoque: ' + s.aprovado_por_nome : null,
      s.aprovado_lider_nome ? 'líder: ' + s.aprovado_lider_nome : null
    ].filter(Boolean).join(' · ');
    html += `
      <div class="os-card">
        <div class="os-top">
          <div class="os-tipo">${s.quantidade_solicitada} ${s.unidade} — ${s.item_nome}${s.requer_dupla_aprovacao ? '<span class="alto-valor-tag">Alto valor</span>' : ''}</div>
          <span class="badge ${s.status}">${statusSolicLabel(s)}</span>
        </div>
        <div class="os-desc">${s.motivo || ''}${aplicacao}</div>
        <div class="os-meta">${s.solicitante_nome} · ${SETORES[s.centro_custo] || s.centro_custo}${aprovacoes ? ' · ' + aprovacoes : ''}${s.valor_estimado ? ' · R$ ' + s.valor_estimado.toFixed(2) : ''}</div>
        ${opts.estoquista && s.status === 'pendente' && !s.aprovado_por ? `
          <div class="os-actions">
            <button onclick="aprovarSolicitacaoEstoque('${id}')">Aprovar (estoque)</button>
            <button class="secondary" onclick="negarSolicitacao('${id}')">Negar</button>
          </div>` : ''}
        ${opts.liderSetor && s.status === 'pendente' && !s.aprovado_lider_por ? `
          <div class="os-actions">
            <button onclick="aprovarSolicitacaoLider('${id}')">Aprovar (líder)</button>
            <button class="secondary" onclick="negarSolicitacao('${id}')">Negar</button>
          </div>` : ''}
        ${opts.retirar && s.status === 'aprovado' && s.solicitante_id === currentUser.uid ? `
          <div class="os-actions">
            <button onclick="retirarProduto('${id}')">Retirar produto</button>
          </div>` : ''}
      </div>`;
  });
  el.innerHTML = html;
}

window.aprovarSolicitacaoEstoque = async function(id){
  try{
    const ref = db.collection('solicitacoes_estoque').doc(id);
    await db.runTransaction(async (t) => {
      const snap = await t.get(ref);
      const s = snap.data();
      const dados = {
        aprovado_por: currentUser.uid,
        aprovado_por_nome: currentUserDoc.nome,
        aprovado_em: firebase.firestore.FieldValue.serverTimestamp()
      };
      if(!s.requer_dupla_aprovacao || s.aprovado_lider_por){
        dados.status = 'aprovado';
      }
      t.update(ref, dados);
    });
    showToast('Aprovado pelo estoque.');
  }catch(e){
    showToast('Erro ao aprovar.', true);
  }
};

window.aprovarSolicitacaoLider = async function(id){
  try{
    const ref = db.collection('solicitacoes_estoque').doc(id);
    await db.runTransaction(async (t) => {
      const snap = await t.get(ref);
      const s = snap.data();
      const dados = {
        aprovado_lider_por: currentUser.uid,
        aprovado_lider_nome: currentUserDoc.nome,
        aprovado_lider_em: firebase.firestore.FieldValue.serverTimestamp()
      };
      if(s.aprovado_por){
        dados.status = 'aprovado';
      }
      t.update(ref, dados);
    });
    showToast('Aprovado pelo líder.');
  }catch(e){
    showToast('Erro ao aprovar.', true);
  }
};

window.negarSolicitacao = async function(id){
  try{
    await db.collection('solicitacoes_estoque').doc(id).update({
      status: 'negado',
      aprovado_por: currentUser.uid,
      aprovado_por_nome: currentUserDoc.nome,
      aprovado_em: firebase.firestore.FieldValue.serverTimestamp()
    });
    showToast('Solicitação negada.');
  }catch(e){
    showToast('Erro ao negar.', true);
  }
};

window.retirarProduto = async function(id){
  try{
    const solicRef = db.collection('solicitacoes_estoque').doc(id);
    const solicFinal = await db.runTransaction(async (t) => {
      const solicSnap = await t.get(solicRef);
      const s = solicSnap.data();
      if(s.status !== 'aprovado') throw new Error('Esta solicitação não está mais disponível para retirada.');
      const itemRef = db.collection('estoque').doc(s.item_id);
      const itemSnap = await t.get(itemRef);
      const atual = itemSnap.data().quantidade_atual || 0;
      if(s.quantidade_solicitada > atual) throw new Error('Estoque insuficiente no momento da retirada.');
      t.update(itemRef, { quantidade_atual: atual - s.quantidade_solicitada, atualizado_em: firebase.firestore.FieldValue.serverTimestamp() });
      t.update(solicRef, {
        status: 'retirado',
        retirado_por: currentUser.uid,
        retirado_por_nome: currentUserDoc.nome,
        retirado_em: firebase.firestore.FieldValue.serverTimestamp()
      });
      const movRef = db.collection('movimentacoes_estoque').doc();
      t.set(movRef, {
        item_id: s.item_id, item_nome: s.item_nome, tipo: 'saida', quantidade: s.quantidade_solicitada,
        valor_unitario: s.custo_unitario || 0, valor_total: s.valor_estimado || 0,
        origem: 'solicitacao', os_id: null, solicitacao_id: id, centro_custo: s.centro_custo,
        maquina_id: s.maquina_id || null, maquina_nome: s.maquina_nome || null,
        responsavel_id: currentUser.uid, responsavel_nome: currentUserDoc.nome,
        liberado_por_nome: s.aprovado_por_nome || null,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      return { ...s, retirado_por_nome: currentUserDoc.nome, retirado_em_local: new Date() };
    });
    showToast('Produto retirado do estoque.');
    if(solicFinal.requer_dupla_aprovacao){
      abrirRecibo(solicFinal);
    }
  }catch(e){
    showToast(e.message || 'Erro ao retirar produto.', true);
  }
};

function renderHistoricoRetiradas(qs, containerId){
  const el = document.getElementById(containerId);
  if(!el) return;
  if(qs.empty){
    el.innerHTML = '<div class="empty-state">Nenhuma retirada registrada ainda.</div>';
    return;
  }
  const linhas = [];
  qs.forEach(doc => linhas.push(doc.data()));
  linhas.sort((a, b) => (b.retirado_em ? b.retirado_em.toMillis() : 0) - (a.retirado_em ? a.retirado_em.toMillis() : 0));
  el.innerHTML = `<table><thead><tr><th>Item</th><th>Qtd</th><th>Quem pegou</th><th>Quem liberou</th><th>Centro de custo</th></tr></thead><tbody>
    ${linhas.slice(0, 40).map(s => `<tr>
      <td>${s.item_nome}</td>
      <td class="mono">${s.quantidade_solicitada} ${s.unidade}</td>
      <td>${s.retirado_por_nome || '—'}</td>
      <td>${s.aprovado_por_nome || '—'}</td>
      <td class="setor-tag">${SETORES[s.centro_custo] || s.centro_custo}</td>
    </tr>`).join('')}
  </tbody></table>`;
}

async function cadastrarUsuario({nome, telefone, email, senha, role, setor, errorElId, onSuccess}){
  const errEl = document.getElementById(errorElId);
  errEl.style.display = 'none';
  if(!nome || !email || !senha){
    errEl.textContent = 'Preencha todos os campos obrigatórios.';
    errEl.style.display = 'block';
    return;
  }
  try{
    const idToken = await currentUser.getIdToken();
    const resp = await fetch('/api/criar-usuario', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + idToken
      },
      body: JSON.stringify({ nome, telefone, email, senha, role, setor })
    });
    const data = await resp.json();
    if(!resp.ok){
      errEl.textContent = data.erro || 'Erro ao cadastrar.';
      errEl.style.display = 'block';
      return;
    }
    showToast('Cadastrado com sucesso.');
    if(onSuccess) onSuccess();
  }catch(e){
    errEl.textContent = 'Erro de conexão. Tente novamente.';
    errEl.style.display = 'block';
  }
}
